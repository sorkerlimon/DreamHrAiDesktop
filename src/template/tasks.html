<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task management dashboard for DreamHRAi - organize, track, and manage your tasks efficiently">
    <meta name="theme-color" content="#6366f1">
    <title>DreamHRAi - Task Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-50: #f8fafc;
            --primary-100: #f1f5f9;
            --primary-200: #e2e8f0;
            --primary-300: #cbd5e1;
            --primary-400: #94a3b8;
            --primary-500: #64748b;
            --primary-600: #475569;
            --primary-700: #334155;
            --primary-800: #1e293b;
            --primary-900: #0f172a;

            --accent-50: #fef2f2;
            --accent-100: #fee2e2;
            --accent-200: #fecaca;
            --accent-300: #fca5a5;
            --accent-400: #f87171;
            --accent-500: #ef4444;
            --accent-600: #dc2626;
            --accent-700: #b91c1c;
            --accent-800: #991b1b;
            --accent-900: #7f1d1d;

            --success-50: #f0fdf4;
            --success-100: #dcfce7;
            --success-200: #bbf7d0;
            --success-300: #86efac;
            --success-400: #4ade80;
            --success-500: #22c55e;
            --success-600: #16a34a;
            --success-700: #15803d;
            --success-800: #166534;
            --success-900: #14532d;

            --warning-50: #fffbeb;
            --warning-100: #fef3c7;
            --warning-200: #fde68a;
            --warning-300: #fcd34d;
            --warning-400: #fbbf24;
            --warning-500: #f59e0b;
            --warning-600: #d97706;
            --warning-700: #b45309;
            --warning-800: #92400e;
            --warning-900: #78350f;

            --info-50: #eff6ff;
            --info-100: #dbeafe;
            --info-200: #bfdbfe;
            --info-300: #93c5fd;
            --info-400: #60a5fa;
            --info-500: #3b82f6;
            --info-600: #2563eb;
            --info-700: #1d4ed8;
            --info-800: #1e40af;
            --info-900: #1e3a8a;


            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            --border-radius-sm: 0.375rem;
            --border-radius-md: 0.5rem;
            --border-radius-lg: 0.75rem;
            --border-radius-xl: 1rem;

            --transition-fast: 0.15s ease-out;
            --transition-normal: 0.3s ease-out;
            --transition-slow: 0.5s ease-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header {
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .header-content {
            text-align: center;
        }

        .title {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1e293b;
        }

        .title-icon {
            width: 2rem;
            height: 2rem;
            color: #64748b;
        }

        .subtitle {
            font-size: 1rem;
            color: #64748b;
            max-width: 500px;
            margin: 0 auto;
            font-weight: 400;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1.5rem 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius-lg);
            color: #374151;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        .back-btn:hover {
            background: #f9fafb;
            border-color: #d1d5db;
            box-shadow: var(--shadow-md);
        }

        .back-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: #6b7280;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            width: 1.25rem;
            height: 1.25rem;
            color: #9ca3af;
            pointer-events: none;
        }

        .search-input {
            padding: 0.875rem 1rem 0.875rem 3rem;
            border-radius: var(--border-radius-lg);
            border: 1px solid #d1d5db;
            background: white;
            color: #1e293b;
            font-size: 0.875rem;
            width: 300px;
            transition: all var(--transition-normal);
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-input::placeholder {
            color: #9ca3af;
        }

        .filter-select {
            padding: 0.875rem 1rem;
            border-radius: var(--border-radius-lg);
            border: 1px solid #d1d5db;
            background: white;
            color: #1e293b;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .filter-select:focus {
            outline: none;
            border-color: #3b82f6;
        }


        .stats-section {
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
            text-align: center;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .stat-icon {
            width: 2.25rem;
            height: 2.25rem;
            margin: 0 auto 0.75rem;
            color: #64748b;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.375rem;
            color: #1e293b;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tasks-section {
            animation: fadeInUp 1s ease-out 0.2s both;
            margin-bottom: 1rem;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .task-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius-lg);
            padding: 1rem;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            position: relative;
            animation: fadeInUp 0.6s ease-out both;
        }

        .task-card:nth-child(1) { animation-delay: 0.1s; }
        .task-card:nth-child(2) { animation-delay: 0.2s; }
        .task-card:nth-child(3) { animation-delay: 0.3s; }
        .task-card:nth-child(4) { animation-delay: 0.4s; }
        .task-card:nth-child(5) { animation-delay: 0.5s; }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .task-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #1e293b;
            line-height: 1.3;
        }

        .task-priority {
            padding: 0.375rem 0.75rem;
            border-radius: var(--border-radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            backdrop-filter: blur(8px);
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .priority-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .priority-low {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .task-description {
            font-size: 0.8125rem;
            color: #64748b;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.6875rem;
            color: #64748b;
        }

        .task-progress {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: var(--border-radius-sm);
            margin-bottom: 1rem;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #3b82f6;
            border-radius: var(--border-radius-sm);
            transition: width var(--transition-normal);
            position: relative;
        }


        .task-status {
            padding: 0.375rem 0.875rem;
            border-radius: var(--border-radius-xl);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            backdrop-filter: blur(8px);
        }

        .status-queue {
            background: rgba(100, 116, 139, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .status-progress {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-complete {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-cancel {
            background: rgba(245, 101, 101, 0.15);
            color: #f87171;
            border: 1px solid rgba(245, 101, 101, 0.3);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .task-actions {
            display: flex;
            gap: 0.375rem;
            flex-wrap: wrap;
        }

        .task-btn {
            padding: 0.375rem 0.75rem;
            border: none;
            border-radius: var(--border-radius-lg);
            font-size: 0.6875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .btn-start {
            background: #22c55e;
            color: white;
        }

        .btn-start:hover {
            background: #16a34a;
        }

        .btn-complete {
            background: #8b5cf6;
            color: white;
        }

        .btn-complete:hover {
            background: #7c3aed;
        }

        .no-tasks {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }

        .empty-icon {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1.5rem;
            color: #d1d5db;
        }

        .no-tasks h3 {
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
        }

        .no-tasks p {
            font-size: 0.875rem;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: var(--border-radius-xl);
            width: 90%;
            max-width: 520px;
            box-shadow: var(--shadow-xl);
            border: 1px solid #e2e8f0;
            animation: slideIn 0.3s ease-out;
            position: relative;
        }

        .modal-content h3 {
            margin-bottom: 2rem;
            color: #1e293b;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: var(--border-radius-lg);
            font-size: 0.875rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            background: #ffffff;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }

        .form-actions button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius-lg);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all var(--transition-fast);
        }

        .form-actions button:first-child {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .form-actions button:first-child:hover {
            background: #e5e7eb;
        }

        .form-actions button:last-child {
            background: #3b82f6;
            color: white;
        }

        .form-actions button:last-child:hover {
            background: #2563eb;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .confirm-modal .modal-content {
            max-width: 400px;
        }

        .confirm-content p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .delete-confirm-btn {
            background: #ef4444 !important;
            color: white !important;
        }

        .delete-confirm-btn:hover {
            background: #dc2626 !important;
        }

        /* Notification Styles */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.3s ease-out;
            max-width: 400px;
            min-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .notification-success .notification-content {
            background: #22c55e;
            color: white;
        }

        .notification-error .notification-content {
            background: #ef4444;
            color: white;
        }

        .notification-warning .notification-content {
            background: #f59e0b;
            color: white;
        }

        .notification-info .notification-content {
            background: #3b82f6;
            color: white;
        }

        .notification-icon {
            font-size: 1.25rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .notification-message {
            flex: 1;
            font-weight: 500;
        }

        .notification-close {
            background: none;
            border: none;
            color: inherit;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            opacity: 0.8;
            transition: opacity var(--transition-fast);
        }

        .notification-close:hover {
            opacity: 1;
        }

        /* Form Validation Styles */
        .field-error {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                padding: 0 1.5rem;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 1.25rem;
            }

            .tasks-grid {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 0 1rem;
            }

            .header {
                margin-bottom: 2rem;
            }

            .title {
                font-size: 2rem;
                flex-direction: column;
                gap: 0.5rem;
            }

            .title-icon {
                width: 2rem;
                height: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }

            .stat-card {
                padding: 1.5rem;
            }

            .stat-icon {
                width: 2.5rem;
                height: 2.5rem;
                margin-bottom: 0.75rem;
            }

            .stat-value {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }

            .search-group {
                flex-direction: column;
                gap: 0.75rem;
            }

            .search-input {
                width: 100%;
            }

            .filter-select {
                width: 100%;
            }

            .add-task-btn {
                justify-content: center;
                width: 100%;
            }

            .tasks-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }

            .task-card {
                padding: 1.25rem;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .modal-content {
                padding: 2rem 1.5rem;
                margin: 1rem;
                max-width: none;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .form-actions button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 0 0.75rem;
            }

            .back-btn {
                padding: 0.625rem 1.25rem;
                font-size: 0.75rem;
            }

            .title {
                font-size: 1.75rem;
            }

            .stat-card {
                padding: 1.25rem;
            }

            .stat-value {
                font-size: 1.75rem;
            }

            .task-card {
                padding: 1rem;
            }

            .task-title {
                font-size: 1.125rem;
            }

            .modal-content {
                padding: 1.5rem 1rem;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .modal-content {
                background: rgba(15, 23, 42, 0.98);
                color: #f1f5f9;
            }

            .modal-content h3 {
                color: #f8fafc;
            }

            .form-group label {
                color: #cbd5e1;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                background: #1e293b;
                border-color: #374151;
                color: #f1f5f9;
            }

            .form-group input:focus,
            .form-group textarea:focus,
            .form-group select:focus {
                border-color: #60a5fa;
            }

            .form-actions button:first-child {
                background: #374151;
                color: #f1f5f9;
                border-color: #4b5563;
            }

            .form-actions button:first-child:hover {
                background: #4b5563;
            }
        }

        /* High contrast mode */
        @media (prefers-contrast: high) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.95);
                --glass-border: rgba(0, 0, 0, 0.3);
            }

            .stat-value {
                -webkit-text-fill-color: #000;
            }

            .title {
                -webkit-text-fill-color: #000;
            }
        }

        /* Loading States */
        .loading-spinner {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }


        /* Enhanced animations */
        .task-card {
            animation-fill-mode: both;
        }

        .task-card.removed {
            animation: slideOut 0.3s ease-out forwards;
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-100%);
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <nav class="nav" aria-label="Main navigation">
            <a href="index.html" class="back-btn" aria-label="Back to Dashboard">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Dashboard
            </a>
        </nav>

        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Task Management
                </h1>
                <p class="subtitle">Organize, track, and manage your tasks efficiently</p>
            </div>
        </header>

        <section class="stats-section" aria-labelledby="stats-heading">
            <h2 id="stats-heading" class="sr-only">Task Statistics</h2>
            <div class="stats-grid">
                <article class="stat-card" role="region" aria-labelledby="total-tasks-label">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="totalTasks" aria-labelledby="total-tasks-label">0</div>
                    <div class="stat-label" id="total-tasks-label">Total Tasks</div>
                </article>
                <article class="stat-card" role="region" aria-labelledby="completed-tasks-label">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="completedTasks" aria-labelledby="completed-tasks-label">0</div>
                    <div class="stat-label" id="completed-tasks-label">Completed</div>
                </article>
                <article class="stat-card" role="region" aria-labelledby="inprogress-tasks-label">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="inProgressTasks" aria-labelledby="inprogress-tasks-label">0</div>
                    <div class="stat-label" id="inprogress-tasks-label">In Progress</div>
                </article>
                <article class="stat-card" role="region" aria-labelledby="pending-tasks-label">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="pendingTasks" aria-labelledby="pending-tasks-label">0</div>
                    <div class="stat-label" id="pending-tasks-label">Pending</div>
                </article>
            </div>
        </section>

        <section class="tasks-section" aria-labelledby="tasks-heading">
            <div class="controls">
            <div class="search-group">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" placeholder="Search tasks..." id="searchInput" aria-label="Search tasks">
                </div>
                <select class="filter-select" id="statusFilter" aria-label="Filter by status">
                    <option value="all">All Status</option>
                    <option value="queue">Queue</option>
                    <option value="progress">In Progress</option>
                    <option value="complete">Complete</option>
                    <option value="cancel">Cancel</option>
                    <option value="failed">Failed</option>
                </select>
            </div>
        </div>

            <h2 id="tasks-heading" class="sr-only">Task List</h2>
            <div class="tasks-grid" id="tasksGrid" role="region" aria-live="polite">
                <div class="no-tasks">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <h3>No tasks found</h3>
                    <p>Try adjusting your search or filter criteria</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/tasks.js"></script>
</body>
</html>
